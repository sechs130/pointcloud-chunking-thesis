<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="mergeTitle mergeDesc">
  <title id="mergeTitle">Ein Punkt, drei widersprüchliche Vorhersagen, vier Regeln</title>
  <desc id="mergeDesc">Derselbe Szenenpunkt liegt in drei überlappenden Chunks. Chunk A sagt Gebäude mit Konfidenz 0,91 bei geringem Abstand zum Chunkzentrum, Chunk B sagt Vegetation mit 0,52 am Chunkrand, Chunk C sagt Gebäude mit 0,74. Majority zählt Stimmen, distance gewichtet nach Abstand zum Chunkzentrum, confidence nach der maximalen Klassenwahrscheinlichkeit, distance_confidence multipliziert beide Gewichte.</desc>
  <style>
    .lab   { font:600 19px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#16181c }
    .sml   { font:400 15px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#4b4f57 }
    .mono  { font:500 15px ui-monospace,'Cascadia Mono',Consolas,monospace; fill:#16181c }
    .rule  { font:600 18px ui-monospace,'Cascadia Mono',Consolas,monospace; fill:#16181c }
    .res   { font:700 19px system-ui,-apple-system,'Segoe UI',sans-serif }
    .hd    { font:700 20px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#16181c }
    .card  { fill:#ffffff; stroke:#d3d5da; stroke-width:2; rx:12 }
  </style>

  <!-- left: geometry -->
  <text class="hd" x="16" y="34">Derselbe Punkt, drei Teilmengen</text>

  <circle cx="210" cy="230" r="118" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6" stroke-width="2.5"/>
  <circle cx="330" cy="300" r="112" fill="#1baf7a" fill-opacity="0.14" stroke="#1baf7a" stroke-width="2.5"/>
  <circle cx="268" cy="146" r="104" fill="#eb6834" fill-opacity="0.14" stroke="#eb6834" stroke-width="2.5"/>

  <text class="lab" fill="#2a78d6" x="96"  y="332">Teilmenge A</text>
  <text class="lab" fill="#1baf7a" x="396" y="392">Teilmenge B</text>
  <text class="lab" fill="#eb6834" x="300" y="62">Teilmenge C</text>

  <!-- chunk centres -->
  <circle cx="210" cy="230" r="6" fill="#2a78d6"/>
  <circle cx="330" cy="300" r="6" fill="#1baf7a"/>
  <circle cx="268" cy="146" r="6" fill="#eb6834"/>

  <!-- the contested point -->
  <line x1="262" y1="226" x2="210" y2="230" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="262" y1="226" x2="330" y2="300" stroke="#1baf7a" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="262" y1="226" x2="268" y2="146" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="262" cy="226" r="11" fill="#16181c"/>
  <circle cx="262" cy="226" r="19" fill="none" stroke="#16181c" stroke-width="2.5"/>
  <text class="sml" x="262" y="486" text-anchor="middle">gestrichelt: Abstand zum Mittelpunkt der Teilmenge</text>

  <!-- middle: the three local predictions -->
  <text class="hd" x="536" y="34">Was die drei lokal sagen</text>
  <g>
    <rect class="card" x="536" y="56" width="300" height="86"/>
    <rect x="536" y="56" width="7" height="86" fill="#2a78d6" rx="3"/>
    <text class="lab"  x="560" y="86">Teilmenge A → <tspan fill="#2a78d6">Gebäude</tspan></text>
    <text class="mono" x="560" y="112">p = 0,91</text>
    <text class="mono" x="700" y="112">d = klein</text>
    <text class="sml"  x="560" y="132">tief in der Teilmenge, voller Kontext</text>

    <rect class="card" x="536" y="158" width="300" height="86"/>
    <rect x="536" y="158" width="7" height="86" fill="#1baf7a" rx="3"/>
    <text class="lab"  x="560" y="188">Teilmenge B → <tspan fill="#1baf7a">Vegetation</tspan></text>
    <text class="mono" x="560" y="214">p = 0,52</text>
    <text class="mono" x="700" y="214">d = groß</text>
    <text class="sml"  x="560" y="234">am Rand, Kontext abgeschnitten</text>

    <rect class="card" x="536" y="260" width="300" height="86"/>
    <rect x="536" y="260" width="7" height="86" fill="#eb6834" rx="3"/>
    <text class="lab"  x="560" y="290">Teilmenge C → <tspan fill="#eb6834">Gebäude</tspan></text>
    <text class="mono" x="560" y="316">p = 0,74</text>
    <text class="mono" x="700" y="316">d = mittel</text>
    <text class="sml"  x="560" y="336">teilweiser Kontext</text>
  </g>
  <text class="sml" x="536" y="380">Beispielwerte zur Erklärung der Regeln —</text>
  <text class="sml" x="536" y="402">gemessen wurden bis zu 12 Stimmen für einen Punkt.</text>

  <!-- right: the four rules -->
  <text class="hd" x="900" y="34">Vier Regeln, das Ergebnis entscheiden</text>
  <g>
    <rect class="card" x="900" y="56" width="364" height="72"/>
    <text class="rule" x="922" y="84">Mehrheitsentscheid</text>
    <text class="sml"  x="922" y="108">jede Stimme zählt gleich  ·  2 zu 1</text>
    <text class="res"  fill="#2a78d6" x="1242" y="96" text-anchor="end">Gebäude</text>

    <rect class="card" x="900" y="140" width="364" height="72"/>
    <text class="rule" x="922" y="168">Abstandsgewichtung</text>
    <text class="sml"  x="922" y="192">Gauß-Gewicht nach Abstand zum Zentrum</text>
    <text class="res"  fill="#2a78d6" x="1242" y="180" text-anchor="end">Gebäude</text>

    <rect class="card" x="900" y="224" width="364" height="72"/>
    <text class="rule" x="922" y="252">Konfidenzgewichtung</text>
    <text class="sml"  x="922" y="276">Gewicht = maximale Klassenwahrscheinlichkeit</text>
    <text class="res"  fill="#2a78d6" x="1242" y="264" text-anchor="end">Gebäude</text>

    <rect class="card" x="900" y="308" width="364" height="72"/>
    <text class="rule" x="922" y="336">Kombinierte Gewichtung</text>
    <text class="sml"  x="922" y="360">beide Gewichte multipliziert</text>
    <text class="res"  fill="#2a78d6" x="1242" y="348" text-anchor="end">Gebäude</text>
  </g>

  <rect x="900" y="404" width="364" height="96" fill="#eef4fd" stroke="#2a78d6" stroke-width="2" rx="12"/>
  <text class="lab" x="922" y="434">Mittel über sechs Verfahren:</text>
  <text class="lab" x="922" y="462" fill="#2a78d6">Konfidenzgewichtung: 0,4096 mIoU</text>
  <text class="sml" x="922" y="486">Mehrheitsentscheid: 0,3242 · Unterschied: 0,085</text>
</svg>
