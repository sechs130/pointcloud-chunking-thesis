<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="pipelineTitle pipelineDesc">
  <title id="pipelineTitle">Die verdeckte Pipeline um das Modell herum</title>
  <desc id="pipelineDesc">Eine Szene mit rund zwölf Millionen Punkten wird zerlegt, jeder Chunk einzeln durch Point Transformer V3 geschickt, die lokalen Vorhersagen werden gespeichert und anschliessend zu einem Szenenergebnis rekombiniert. Nur der mittlere Schritt ist das Modell; die vier anderen Schritte sind die eigentliche Arbeit dieser Thesis.</desc>
  <style>
    .box   { fill:#ffffff; stroke:#d3d5da; stroke-width:2; rx:14 }
    .mine  { fill:#eef4fd; stroke:#2a78d6; stroke-width:2.5 }
    .model { fill:#f4f5f7; stroke:#8b9099; stroke-width:2.5 }
    .t     { font:600 21px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#16181c; text-anchor:middle }
    .s     { font:400 16px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#4b4f57; text-anchor:middle }
    .num   { font:700 15px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#2a78d6; text-anchor:middle }
    .numg  { font:700 15px system-ui,-apple-system,'Segoe UI',sans-serif; fill:#6b7078; text-anchor:middle }
    .cap   { font:600 17px system-ui,-apple-system,'Segoe UI',sans-serif; text-anchor:middle }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9099"/>
    </marker>
  </defs>

  <!-- five stages -->
  <g>
    <rect class="box mine"  x="16"   y="78" width="212" height="112"/>
    <text class="num" x="122" y="104">1</text>
    <text class="t"   x="122" y="132">Zerlegung</text>
    <text class="s"   x="122" y="158">6 Strategien</text>
    <text class="s"   x="122" y="178">45.000 Punkte/Chunk</text>

    <rect class="box model" x="276"  y="78" width="212" height="112"/>
    <text class="numg" x="382" y="104">2</text>
    <text class="t"   x="382" y="132">PTv3</text>
    <text class="s"   x="382" y="158">unverändert,</text>
    <text class="s"   x="382" y="178">für alle Läufe identisch</text>

    <rect class="box mine"  x="536"  y="78" width="212" height="112"/>
    <text class="num" x="642" y="104">3</text>
    <text class="t"   x="642" y="132">Chunk-Cache</text>
    <text class="s"   x="642" y="158">Koordinaten +</text>
    <text class="s"   x="642" y="178">Klassenwahrscheinlichkeiten</text>

    <rect class="box mine"  x="796"  y="78" width="212" height="112"/>
    <text class="num" x="902" y="104">4</text>
    <text class="t"   x="902" y="132">Rekombination</text>
    <text class="s"   x="902" y="158">4 Merge-Regeln</text>
    <text class="s"   x="902" y="178">bis 12 Stimmen je Punkt</text>

    <rect class="box mine"  x="1056" y="78" width="208" height="112"/>
    <text class="num" x="1160" y="104">5</text>
    <text class="t"   x="1160" y="132">Szenenergebnis</text>
    <text class="s"   x="1160" y="158">Metriken, Confusion,</text>
    <text class="s"   x="1160" y="178">Support-Statistik</text>
  </g>

  <g stroke="#8b9099" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <path d="M232 134 H270"/>
    <path d="M492 134 H530"/>
    <path d="M752 134 H790"/>
    <path d="M1012 134 H1050"/>
  </g>

  <!-- input / output annotations -->
  <text class="s" x="16" y="52" text-anchor="start">eine DALES-Szene, ~12,1 Mio. Punkte</text>
  <text class="s" x="1264" y="52" text-anchor="end">wieder eine Szene, jetzt gelabelt</text>

  <!-- what belongs to whom -->
  <line x1="16" y1="222" x2="228" y2="222" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
  <line x1="536" y1="222" x2="1264" y2="222" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
  <line x1="276" y1="222" x2="488" y2="222" stroke="#8b9099" stroke-width="4" stroke-linecap="round"/>
  <text class="cap" fill="#2a78d6" x="122" y="252">Gegenstand dieser Arbeit</text>
  <text class="cap" fill="#6b7078" x="382" y="252">fest gehalten</text>
  <text class="cap" fill="#2a78d6" x="900" y="252">Gegenstand dieser Arbeit</text>
</svg>
